<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모션 뼈대</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  /* 무대는 항상 왼쪽 위 (0,0)에서 W×H다. render.mjs가 그 영역만 찍는다. */
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden;
    --bg: #f3efe7; --fg: #141414; --accent: #ff5a1f;
    background: var(--bg); color: var(--fg);
    font: 800 200px/1 system-ui, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .scene { position: absolute; inset: 0; display: grid; place-items: center; visibility: hidden; }
  #title span { display: inline-block; }
  #dot i { position: absolute; left: 0; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; background: var(--accent); }
  #card { background: var(--accent); text-align: center; }
  #card p { margin: 0; }
  #card small { display: block; margin-top: 40px; font: 500 48px/1 ui-monospace, Consolas, Menlo, monospace; }
</style>
</head>
<body>
<div id="stage">
  <div id="title" class="scene"><div></div></div>
  <div id="dot" class="scene"><i></i></div>
  <div id="card" class="scene"><p>fullops-motion<small>seek(t) · spring · beat</small></p></div>
</div>
<script>
'use strict'
// 규격. render.mjs의 --width --height --fps --duration 에 같은 값을 준다.
const W = 1920, H = 1080, FPS = 60, DURATION = 8, BPM = 120
const BEAT = 60 / BPM

// ── 도우미: 모두 시간의 순수 함수다 ──────────────────────────────
const clamp01 = x => Math.min(1, Math.max(0, x))
const lerp = (a, b, p) => a + (b - a) * p
const span = (t, a, b) => clamp01((t - a) / (b - a))             // 구간 [a, b]를 0..1로
const easeOut = p => 1 - (1 - clamp01(p)) ** 3
const easeInOut = p => { p = clamp01(p); return p < 0.5 ? 4 * p ** 3 : 1 - (2 - 2 * p) ** 3 / 2 }

// 닫힌 형식 스프링 계단 응답(0 → 1). hz는 고유 진동수, zeta는 감쇠비(1보다 작으면 오버슈트).
function spring(t, hz = 3, zeta = 0.6) {
  if (t <= 0) return 0
  const w = 2 * Math.PI * hz
  if (zeta >= 1) return 1 - Math.exp(-w * t) * (1 + w * t)       // 1 이상은 임계 감쇠로 본다
  const wd = w * Math.sqrt(1 - zeta * zeta)
  return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta * w / wd) * Math.sin(wd * t))
}
// 목표가 여러 번 바뀌는 값. changes는 [[시각, 목표], …]이고 바뀔 때마다 스프링 하나를 더한다.
function springTo(t, from, changes, hz, zeta) {
  let value = from, prev = from
  for (const [at, to] of changes) { value += (to - prev) * spring(t - at, hz, zeta); prev = to }
  return value
}
// 시드 고정 난수(mulberry32). Math.random 대신 쓴다.
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0
    let x = Math.imul(seed ^ seed >>> 15, 1 | seed)
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x
    return ((x ^ x >>> 14) >>> 0) / 4294967296
  }
}

// ── 요소 준비(한 번만) ───────────────────────────────────────────
const $ = id => document.getElementById(id)
const stage = $('stage')
stage.style.width = W + 'px'
stage.style.height = H + 'px'
const glyphs = [...'MOTION'].map(ch => {
  const g = document.createElement('span')
  g.textContent = ch
  $('title').firstElementChild.append(g)
  return g
})
const tilt = glyphs.map(rng(7))                                  // 글자마다 시드 고정 기울기
const dot = $('dot').firstElementChild
const cardText = $('card').firstElementChild

// ── 장면표: 시작·끝(초)과 그 구간의 그리기. u는 장면 안 시각, len은 장면 길이다 ──
const SCENES = [
  { el: $('title'), from: 0, to: 3, draw(u, len) {
    glyphs.forEach((g, i) => {
      const at = i * BEAT / 4                                    // 16분음표 스태거
      const p = spring(u - at)
      g.style.transform = `translateY(${lerp(160, 0, p)}px) rotate(${lerp((tilt[i] - 0.5) * 50, 0, p)}deg)`
      g.style.opacity = span(u, at, at + 0.12) * (1 - easeOut(span(u, len - 0.4, len)))
    })
  } },
  { el: $('dot'), from: 3, to: 6, draw(u, len) {
    const x = springTo(u, 0.3, [[0, 0.5], [2 * BEAT, 0.7], [4 * BEAT, 0.5]], 2.5, 0.45) * W
    const grow = lerp(1, 60, easeInOut(span(u, len - 0.5, len)))  // 네 모서리 너머까지 키워 다음 장면으로 넘긴다
    dot.style.transform = `translateX(${x}px) scale(${spring(u, 4, 0.5) * grow})`
  } },
  { el: $('card'), from: 6, to: 8, draw(u, len) {
    cardText.style.transform = `translateY(${lerp(80, 0, easeOut(u / 0.6))}px)`
    this.el.style.opacity = 1 - easeInOut(span(u, len - 0.5, len)) // 빈 바탕(첫 프레임)으로 돌아가 루프가 맞는다
  } },
]

// 화면의 모든 상태를 t(초)에서 다시 계산한다. 앞 프레임의 상태에 기대지 않는다.
function draw(t) {
  for (const s of SCENES) {
    const on = t >= s.from && t < s.to
    s.el.style.visibility = on ? 'visible' : 'hidden'
    if (on) s.draw(t - s.from, s.to - s.from)
  }
}

// ── seek와 미리보기 ──────────────────────────────────────────────
let preview = true
// render.mjs가 프레임 시각마다 부른다. 한 번 불리면 미리보기 루프는 멈춘다.
window.seek = t => { preview = false; draw(clamp01(t / DURATION) * DURATION) }

// 브라우저에서 바로 열면 창에 맞춰 줄여 실시간으로 돈다. 창이 W×H면(렌더) 배율 1, 이동 0이다.
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H)
  stage.style.transform = `translate(${(innerWidth - W * s) / 2}px, ${(innerHeight - H * s) / 2}px) scale(${s})`
}
fit()
addEventListener('resize', fit)
const at = new URLSearchParams(location.search).get('t')         // index.html?t=3.5 는 그 시각에 멈춰 보여 준다
if (at !== null) window.seek(Number(at))
else {
  const t0 = performance.now()
  const tick = now => { if (preview) { draw(Math.max(0, now - t0) / 1000 % DURATION); requestAnimationFrame(tick) } }
  draw(0)
  requestAnimationFrame(tick)
}
</script>
</body>
</html>
