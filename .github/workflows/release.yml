# 릴리스 배포본을 만들어 PR로 올린다(install-and-retire.md 1.8절, 4절 P8, D1·D2·D4·D5).
# main에 바로 push하지 않고 태그도 만들지 않는다. 사람이 PR을 보고 머지하는 것이 공개 승인이다(D10).
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "릴리스 버전. Cargo.toml의 workspace 버전과 같아야 한다(예: 2.0.0)"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    # 패널 카탈로그가 가리키는 커밋이 main에 있어야 사용자가 설치할 수 있다
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 버전 확인
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "버전 꼴이 x.y.z가 아니다: $VERSION"; exit 1; }
          workspace=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "$workspace" = "$VERSION" ] || { echo "Cargo.toml의 버전($workspace)과 입력($VERSION)이 다르다"; exit 1; }
          package=$(node -p "require('./package.json').version")
          [ "$package" = "$VERSION" ] || { echo "package.json의 버전($package)과 입력($VERSION)이 다르다"; exit 1; }
          [ -f "crates/fullops/assets/releases/$VERSION.md" ] || { echo "릴리스 노트 crates/fullops/assets/releases/$VERSION.md가 없다"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - name: 패널 버전 확인
        # 있는 카탈로그와 겹치는지 보려면 저장소 루트에 써야 한다. 이 잡의 작업 트리는 버린다
        run: cargo xtask orca-catalog --root . --commit "$GITHUB_SHA"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: 타깃별 릴리스 빌드
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          mkdir -p prebuilt
          for target in ${TARGETS//,/ }; do
            cargo build --release -p fullops --target "$target"
            # 패키지 안의 이름(docs/build.md '타깃별 바이너리')
            case "$target" in
              x86_64-pc-windows-msvc) cp "target/$target/release/fullops.exe" prebuilt/fullops.exe ;;
              aarch64-apple-darwin) cp "target/$target/release/fullops" prebuilt/fullops-darwin-arm64 ;;
              x86_64-apple-darwin) cp "target/$target/release/fullops" prebuilt/fullops-darwin-x64 ;;
              x86_64-unknown-linux-gnu) cp "target/$target/release/fullops" prebuilt/fullops-linux-x64 ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: prebuilt/
          if-no-files-found: error

  dist:
    needs: build
    # POSIX 러너라야 xtask dist가 실행 비트를 준다(docs/build.md '실행 비트')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: prebuilt
      - name: 바이너리 넷 확인
        run: |
          for name in fullops.exe fullops-darwin-arm64 fullops-darwin-x64 fullops-linux-x64; do
            [ -f "prebuilt/$name" ] || { echo "prebuilt/$name이 없다"; exit 1; }
          done
      - name: 배포본과 카탈로그 둘
        run: cargo xtask dist --root . --prebuilt prebuilt --no-validate
      - name: 패널 카탈로그
        # 커밋은 이 실행의 main 커밋(github.sha)이다. 릴리스 커밋은 squash 머지되면 main에 남지 않는다
        run: cargo xtask orca-catalog --root . --commit "$GITHUB_SHA"
      - name: 릴리스 PR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="release/v$VERSION-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # dist/directory는 싣지 않는다(D2). .gitignore와 상관없이 정한 것만 싣는다
          git add -f dist/native/fullops .claude-plugin/marketplace.json .agents/plugins/marketplace.json orca-catalog.json
          git commit -m "릴리스: fullops $VERSION 배포본과 카탈로그"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "릴리스: fullops $VERSION" \
            --body "$(cat <<EOF
          release 워크플로(실행 $GITHUB_RUN_ID)가 \`$GITHUB_SHA\`에서 만든 배포본이다. 머지하면 npx·Claude Code·Codex·Orca 사용자에게 공개된다.

          - \`dist/native/fullops\`: 바이너리 넷과 런처, SHA256SUMS
          - \`.claude-plugin/marketplace.json\`, \`.agents/plugins/marketplace.json\`
          - \`orca-catalog.json\`: 패널 releases 항목. commit은 \`$GITHUB_SHA\`

          머지 전에 사람이 확인한다(docs/build.md '릴리스 워크플로'):
          - [ ] 이 브랜치를 받아 \`claude plugin validate dist/native/fullops\` 등 호스트 검증
          - [ ] \`orca plugin validate orca-catalog.json --json\`, 할 수 있으면 \`orca plugin release-entry panel --json\`(\`$GITHUB_SHA\` 체크아웃)과 releases[0] 비교
          - [ ] 바이너리 모드가 100755인지(\`git ls-files -s dist/native/fullops/bin\`)
          EOF
          )"
