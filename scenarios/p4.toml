  * [ ] 테스트를 더한다"""

# J-03: 패킷에 없는 경로, 필수 항목의 exclude
[[step]]
act = "file"
path = "decisions-path.json"
content = "[{\"path\": \"src/nope.rs\", \"action\": \"exclude\", \"reason\": \"패킷에 없는 경로\"}]\n"

[[step]]
act = "file"
path = "decisions-required.json"
content = "[{\"path\": \".fullops-squad/FULLOPS.md\", \"action\": \"exclude\", \"reason\": \"필수 항목\"}]\n"

[[step]]
act = "file"
path = "decisions-good.json"
content = "[{\"path\": \"src/pay/card.rs\", \"action\": \"exclude\", \"reason\": \"이 과제와 무관한 호출\"}]\n"

[[step]]
act = "runs_fullops"
args = ["packet", "build", "PAY-12", "--role", "dev", "--seed", "src/pay/retry.rs", "--write-inbox", "--decisions", "decisions-path.json"]
expect = { verdict = "deny", rule = "J-03", flow = "stopped", escape = "--seed" }

[[step]]
act = "runs_fullops"
args = ["packet", "build", "PAY-12", "--role", "dev", "--seed", "src/pay/retry.rs", "--write-inbox", "--decisions", "decisions-required.json"]
expect = { verdict = "deny", rule = "J-03", flow = "stopped" }

# J-03에 안 걸린다. 의견은 항목을 바꾸지 않는다
