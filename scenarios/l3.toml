name = "구현자와 같은 세션의 리뷰 check, 미해결 high"
origin = "설계 12.2절 L3. 1.24.0: 실패"

# 리뷰어가 result.json을 채우는 동사가 없어(l2.toml의 주석과 같다) 구현자와 같은 세션·미해결 high의 경우는
# crates/fullops/tests/review_merge.rs의 accepted_review_lets_large_change_merge가 본다(RV-04, RV-07).
# 여기서는 채우지 않은 리뷰 기록이 검사와 병합을 통과하지 못하는 것까지 본다.

# 400줄 변경의 완료 보고: 배정 → 작업 → 완료 보고 작성 → lint → done → worker_done → wait
[[step]]
act = "lead_dispatches"
key = "A-1"
role = "dev"

[[step]]
act = "worker_works"
role = "dev"
key = "A-1"
path = "src/big.py"
lines = 400

[[step]]
act = "edits_file"
who = "dev"
path = ".fullops-squad/handovers/to_dev.md"
old = "## 완료 보고\n"
new = "## 완료 보고\n\n브랜치 fullops/dev. 구현과 확인을 마쳤다.\n"

[[step]]
act = "commits"
who = "dev"
message = "완료 보고 작성"

[[step]]
act = "worker_lints"
role = "dev"
expect = { verdict = "pass" }

[[step]]
act = "worker_finishes"
role = "dev"
expect = { verdict = "pass", escape = "[완료] A-1" }

[[step]]
act = "orca_sends"
subject = "A-1 완료"

[[step]]
act = "lead_waits"

[[step]]
act = "runs_fullops"
args = ["review", "snapshot", "A-1"]
expect = { verdict = "pass" }

[[step]]
act = "runs_fullops"
args = ["review", "check", "A-1"]
expect = { verdict = "deny", rule = "RV-04", flow = "stopped" }

[[step]]
act = "lead_merges"
key = "A-1"
expect = { verdict = "deny", rule = "M-04", escape = "fullops review check" }
