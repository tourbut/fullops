name = "패킷 있는 과제의 리뷰 check: 패킷을 만든 커밋 위의 작업인지와 처리 기록을 본다"
origin = "설계 12.2절 P5 (처리 기록을 쓴 뒤의 done과 review check 10번의 통과·J-15·J-16은 tests/explore.rs가 패킷의 input_sha256을 읽어 잇는다)"

