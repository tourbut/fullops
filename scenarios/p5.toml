    retry(1)
}
'''

[[step]]
act = "file"
path = "docs/pay.md"
content = '''
# 결제 설계

[재시도](../src/pay/retry.rs) 정책을 적는다.
'''

[[step]]
act = "commits"
message = "시나리오 파일"

# 준비: 분류하고 인박스를 만든 뒤 지시 본문을 쓴다
[[step]]
act = "lead_routes"
key = "PAY-12"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "lead_writes_task"
key = "PAY-12"
role = "dev"
goal = "결제 재시도 버튼"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "edits_file"
path = ".fullops-squad/handovers/to_dev.md"
old = "- [ ] 구체적 작업과 수정할 파일"
new = """
- [ ] `retry`의 중복 클릭을 막는다
  * [ ] 테스트를 더한다"""

# 원천이 없는 갱신 ID가 있어 partial인 패킷
[[step]]
act = "runs_fullops"
args = ["packet", "build", "PAY-12", "--role", "dev", "--seed", "src/pay/retry.rs", "--update-doc", "D99", "--write-inbox"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 검사하는 커밋이 패킷을 만든 커밋보다 앞이다
[[step]]
act = "runs_fullops"
args = ["packet", "check", "PAY-12", "--role", "dev", "--completion", "--head", "HEAD~1"]
expect = { verdict = "deny", rule = "J-13", flow = "stopped" }

# J-13에 안 걸리고 처리 기록만 없다
[[step]]
act = "runs_fullops"
args = ["packet", "check", "PAY-12", "--role", "dev", "--completion", "--head", "HEAD"]
expect = { verdict = "deny", rule = "J-14", flow = "stopped" }

[[step]]
act = "lead_dispatches"
df = "DF-16"
key = "PAY-12"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "worker_works"
role = "dev"
key = "PAY-12"

[[step]]
act = "edits_file"
who = "dev"
path = ".fullops-squad/handovers/to_dev.md"
old = "## 완료 보고\n"
new = "## 완료 보고\n\n브랜치 fullops/dev. 구현과 확인을 마쳤다.\n"

[[step]]
act = "commits"
who = "dev"
message = "완료 보고 작성"

[[step]]
act = "worker_lints"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

# 완료(R-10): 처리 기록이 없다
[[step]]
act = "worker_finishes"
role = "dev"
expect = { verdict = "deny", rule = "R-10", flow = "stopped", escape = "J-14" }
