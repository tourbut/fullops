name = "설계 역할은 코드 파일을 고치지 못하고 .fullops-squad 아래는 고칠 수 있다"
origin = "설계 12.2절 E5"

[setup]
roles = { dev = "worker", architecture = "design" }

[[step]]
act = "writes_file"
who = "architecture"
path = "src/pay/retry.py"
content = "print(1)\n"
expect = { verdict = "deny", rule = "T-07", flow = "stopped", escape = "구현 역할에 넘긴다" }

[[step]]
act = "writes_file"
who = "architecture"
path = ".fullops-squad/docs/design/pay.md"
content = "# 결제 설계\n"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "writes_file"
who = "architecture"
path = "docs/pay.md"
content = "# 결제\n"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "writes_file"
who = "dev"
path = "src/pay/retry.py"
content = "print(1)\n"
expect = { verdict = "pass", flow = "continues" }
