name = "하위 worker가 남은 부모는 완료를 보고하지 못한다"
origin = "12.2 R4, DF-23"

[[step]]
act = "lead_dispatches"
key = "A-1"
role = "dev"
expect = { verdict = "pass" }

[[step]]
act = "worker_subdispatches"
role = "dev"
key = "A-1"
brief = "src/b.py를 맡는다. 끝나면 바꾼 파일을 보고한다"
expect = { verdict = "pass" }

[[step]]
act = "worker_works"
role = "dev"
key = "A-1"

[[step]]
act = "edits_file"
who = "dev"
path = ".fullops-squad/handovers/to_dev.md"
old = "## 완료 보고\n"
new = "## 완료 보고\n\n브랜치 fullops/dev. 구현과 확인을 마쳤다.\n"

[[step]]
act = "commits"
who = "dev"
message = "완료 보고 작성"

# 하위 worker가 정산 전이다
[[step]]
act = "worker_finishes"
role = "dev"
no_checks = "시나리오"
expect = { verdict = "deny", rule = "R-11", escape = "fullops wait --run run_2" }

[[step]]
act = "file"
who = "dev"
path = "src/b.py"
content = "print(2)\n"

# 코드 변경이 미커밋이고 세션 핸들이 없다: X-05 (b) 하나만 걸린다
[[step]]
act = "stops"
who = "dev"
env = { ORCA_TERMINAL_HANDLE = "" }
pending = "B"
expect = { verdict = "block", rule = "X-05" }

# 세션 핸들이 하위 Run의 coordinator다
[[step]]
act = "stops"
who = "dev"
pending = "B"
expect = { verdict = "pass" }

[[step]]
act = "orca_sends"
run = "run_2"
dispatch = "ctx_2"
task = "task_2"
id = "msg_sub"
body = "바꾼 파일: src/b.py"

[[step]]
act = "runs_fullops"
who = "dev"
args = ["wait", "--run", "run_2"]
expect = { verdict = "pass", escape = "--ack msg_sub" }

# 보고를 받았어도 처리 표시 전에는 남은 것이다
[[step]]
act = "worker_finishes"
role = "dev"
no_checks = "시나리오"
expect = { verdict = "deny", rule = "R-11" }

[[step]]
act = "stops"
who = "dev"
pending = "B"
expect = { verdict = "block", rule = "X-05" }

[[step]]
act = "runs_fullops"
who = "dev"
args = ["wait", "--run", "run_2", "--ack", "msg_sub", "--no-wait"]
expect = { verdict = "pass" }

[[step]]
act = "stops"
who = "dev"
pending = "B"
expect = { verdict = "block", rule = "X-01" }

[[step]]
act = "commits"
who = "dev"
message = "하위 worker의 변경을 확인해 커밋"

[[step]]
act = "worker_lints"
role = "dev"
pending = "D"

[[step]]
act = "worker_finishes"
role = "dev"
no_checks = "시나리오"
expect = { verdict = "pass", escape = "[완료] A-1" }

# lead가 받는 보고는 부모의 것 하나다
[[step]]
act = "orca_sends"
dispatch = "ctx_1"
task = "task_1"
id = "msg_parent"

[[step]]
act = "lead_waits"
expect = { verdict = "pass", escape = "fullops merge A-1" }

[[step]]
act = "stops"
pending = "B"
expect = { verdict = "block", rule = "X-06" }
