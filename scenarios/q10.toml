name = "install --remove-hooks와 그 뒤의 확인"
origin = "12.2 Q10"

[[step]]
act = "fakes"
names = ["grok", "npx"]
# 통합 패키지 폴더를 흉내 낸 재료. install.json의 source가 이 폴더를 가리켜 플러그인 루트가 된다
[[step]]
act = "file"
path = "../pkg/VERSION"
content = "2.0.0\n"
[[step]]
act = "file"
path = "../pkg/bin/fullops"
content = "#!/bin/sh\n"
[[step]]
act = "file"
path = "../pkg/skills/fullops-work/SKILL.md"
content = "---\nname: fullops-work\n---\n"
[[step]]
act = "file"
path = "../pkg/hosts/grok/plugin.json"
content = "{\"name\":\"fullops\",\"version\":\"2.0.0\",\"description\":\"시험\"}\n"
[[step]]
act = "file"
path = "../pkg/hosts/grok/.mcp.json"
content = "{\"mcpServers\":{\"context7\":{\"type\":\"http\",\"url\":\"https://mcp.context7.com/mcp\"}}}\n"
[[step]]
act = "file"
path = "../pkg/hosts/agy/plugin.json"
content = "{\"name\":\"fullops\",\"displayName\":\"FullOps\",\"description\":\"시험\",\"version\":\"2.0.0\"}\n"
[[step]]
act = "file"
path = "../pkg/hosts/agy/hooks.json"
content = "{\"fullops\":{}}\n"
[[step]]
act = "file"
path = "../pkg/hosts/agy/mcp_config.json"
content = "{\"mcpServers\":{\"context7\":{\"url\":\"https://mcp.context7.com/mcp\"}}}\n"
[[step]]
act = "file"
path = "../home/.fullops/install.json"
content = "{\"version\":\"0.0.1\",\"sha256\":\"\",\"source\":\"../pkg\",\"at\":0,\"previous\":null}\n"
[[step]]
act = "runs_fullops"
raw = true
args = ["install", "--hosts", "grok"]
env = { PATH = "../bin", FULLOPS_OFFLINE = "0" }
expect = { verdict = "pass", exit = 0 }
# fullops가 쓴 hook 등록 파일만 지우고 경로를 낸다. 호스트 CLI를 부르지 않는다
[[step]]
act = "runs_fullops"
raw = true
args = ["install", "--remove-hooks"]
env = { PATH = "../bin" }
expect = { verdict = "pass", exit = 0, escape = "fullops.json" }
[[step]]
act = "host_replies"
when = ["grok", "plugin", "list"]
stdout = [{ name = "fullops" }]
# 로컬 경로로 설치한 grok 플러그인은 목록에 이름만 나온다. 빠진 것은 hook 등록이다
[[step]]
act = "runs_fullops"
raw = true
args = ["install", "--check", "--hosts", "grok"]
env = { PATH = "../bin", FULLOPS_OFFLINE = "0" }
expect = { verdict = "deny", exit = 2, escape = "grok: hook 등록" }
[[step]]
act = "runs_fullops"
raw = true
args = ["doctor"]
env = { PATH = "../bin" }
expect = { verdict = "pass", escape = "grok: hook 등록" }
