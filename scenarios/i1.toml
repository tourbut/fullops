# 다른 묶음의 명령이 만드는 state.json과 세션 기록에 기대는 단계는 pending이다.
# 같은 규칙의 걸림·안 걸림은 crates/fullops/tests/hook.rs가 저장 계층으로 상태를 만들어 지금 확인한다.
name = "lead가 분류만 하고 끝내면 한 번 막는다"
origin = "설계 12.2절 I1"

[[step]]
act = "session_starts"
expect = { verdict = "context", flow = "continues" }

[[step]]
act = "lead_routes"
key = "A-1"
role = "dev"
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
pending = "C"
expect = { verdict = "block", rule = "X-04", flow = "stopped", escape = "fullops task new" }

[[step]]
act = "stops"
pending = "C"
expect = { verdict = "warn", flow = "continues" }

[[step]]
act = "lead_plans"
key = "A-1"
role = "dev"
status = "보류(다음 분기)"
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "user_prompts"
text = "다음"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
pending = "C"
expect = { verdict = "pass", flow = "continues" }
