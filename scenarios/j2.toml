# 다른 묶음의 명령이 만드는 state.json과 세션 기록에 기대는 단계는 pending이다.
# 같은 규칙의 걸림·안 걸림은 crates/fullops/tests/hook.rs가 저장 계층으로 상태를 만들어 지금 확인한다.
name = "로컬 기본 브랜치가 뒤처져도 원격에 들어가 있으면 막지 않는다"
origin = "설계 12.2절 J2"

[[step]]
act = "session_starts"
expect = { verdict = "context", flow = "continues" }

[[step]]
act = "worker_reports"
role = "dev"
key = "A-1"
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "git"
args = ["push", "-q", "origin", "fullops/dev:main"]
pending = "C"

[[step]]
act = "git"
args = ["fetch", "-q", "origin"]
pending = "C"

[[step]]
act = "stops"
pending = "C"
expect = { verdict = "pass", flow = "continues" }
