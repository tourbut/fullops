name = "install: npx가 PATH에 없다"
origin = "12.2 Q5"

[[step]]
act = "fakes"
names = ["claude", "grok"]
# 통합 패키지 폴더를 흉내 낸 재료. install.json의 source가 이 폴더를 가리켜 플러그인 루트가 된다
[[step]]
act = "file"
path = "../pkg/VERSION"
content = "2.0.0\n"
[[step]]
act = "file"
path = "../pkg/bin/fullops"
content = "#!/bin/sh\n"
[[step]]
act = "file"
path = "../pkg/skills/fullops-work/SKILL.md"
content = "---\nname: fullops-work\n---\n"
[[step]]
act = "file"
path = "../pkg/hosts/grok/plugin.json"
content = "{\"name\":\"fullops\",\"version\":\"2.0.0\",\"description\":\"시험\"}\n"
[[step]]
act = "file"
path = "../pkg/hosts/grok/.mcp.json"
content = "{\"mcpServers\":{\"context7\":{\"type\":\"http\",\"url\":\"https://mcp.context7.com/mcp\"}}}\n"
[[step]]
act = "file"
path = "../pkg/hosts/agy/plugin.json"
content = "{\"name\":\"fullops\",\"displayName\":\"FullOps\",\"description\":\"시험\",\"version\":\"2.0.0\"}\n"
[[step]]
act = "file"
path = "../pkg/hosts/agy/hooks.json"
content = "{\"fullops\":{}}\n"
[[step]]
act = "file"
path = "../pkg/hosts/agy/mcp_config.json"
content = "{\"mcpServers\":{\"context7\":{\"url\":\"https://mcp.context7.com/mcp\"}}}\n"
[[step]]
act = "file"
path = "../home/.fullops/install.json"
content = "{\"version\":\"0.0.1\",\"sha256\":\"\",\"source\":\"../pkg\",\"at\":0,\"previous\":null}\n"
# 스킬 단계만 건너뛴다. grok에 넘긴 인자에 --trust가 없다
[[step]]
act = "runs_fullops"
raw = true
args = ["install"]
env = { PATH = "../bin", FULLOPS_OFFLINE = "0" }
expect = { verdict = "pass", exit = 0, escape = "사용자 스킬 설치를 건너뛴다" }
