# 다른 묶음의 명령이 만드는 state.json과 세션 기록에 기대는 단계는 pending이다.
# 같은 규칙의 걸림·안 걸림은 crates/fullops/tests/hook.rs가 저장 계층으로 상태를 만들어 지금 확인한다.
name = "하위 worker 세션: 커밋·lint·완료 기록은 부모가 한다"
origin = "설계 12.2절 R5 (DF-23)"

[[step]]
act = "lead_dispatches"
key = "A-1"
role = "dev"
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "worker_works"
role = "dev"
key = "A-1"
pending = "C"

[[step]]
act = "worker_subdispatches"
role = "dev"
key = "A-1"
brief = "src/sub/ 아래를 맡는다. 완료 조건: 단위 시험 통과"
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "session_starts"
who = "dev"
session = "sub"
pending = "C"
expect = { verdict = "context", flow = "continues", escape = "하위 worker다" }

[[step]]
act = "preamble_arrives"
who = "dev"
session = "sub"
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "file"
who = "dev"
path = "src/sub/x.py"
content = "print(1)\n"
pending = "C"

[[step]]
act = "orca_replies"
when = ["orchestration", "worker-show"]
stdout = { ok = true, result = { dispatchId = "ctx_9", taskId = "task_9", runId = "run_9", terminal = "term_9", state = "ready", stage = "input_accepted", liveness = "live" } }

[[step]]
act = "stops"
who = "dev"
session = "sub"
pending = "C"
expect = { verdict = "block", rule = "X-03", flow = "stopped", escape = "worker_done" }

[[step]]
act = "runs_fullops"
who = "dev"
session = "sub"
args = ["done"]
pending = "C"
expect = { verdict = "deny", rule = "R-01", flow = "stopped" }
