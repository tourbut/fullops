name = "PowerShell의 호출 연산자와 역슬래시 경로로 부른 worker-start를 알아본다"
origin = "설계 12.2절 C3 (DF-5)"

[[step]]
act = "runs_shell"
dialect = "powershell"
command = "& \"C:\\Program Files\\Orca\\orca.exe\" orchestration worker-start --run run_1 --spec x"
expect = { verdict = "deny", rule = "T-01", flow = "stopped", escape = "fullops dispatch" }

[[step]]
act = "runs_shell"
dialect = "powershell"
command = "$orca = 'C:\\tools\\orca.exe'; & $orca orchestration worker-start --spec x"
expect = { verdict = "deny", rule = "T-01", flow = "stopped" }

[[step]]
act = "runs_shell"
dialect = "powershell"
command = "Write-Output \"orca orchestration worker-start\""
expect = { verdict = "pass", flow = "continues" }

# Start-Process, Invoke-Expression, 스크립트 블록, orca.ps1로 불러도 같은 명령이다
[[step]]
act = "runs_shell"
dialect = "powershell"
command = "Start-Process orca -ArgumentList 'orchestration','worker-start','--run','run_1'"
expect = { verdict = "deny", rule = "T-01", flow = "stopped" }

[[step]]
act = "runs_shell"
dialect = "powershell"
command = "Invoke-Expression 'orca orchestration worker-start --run run_1'"
expect = { verdict = "deny", rule = "T-01", flow = "stopped" }

[[step]]
act = "runs_shell"
dialect = "powershell"
command = "if ($true) { & orca.ps1 orchestration worker-start --run run_1 }"
expect = { verdict = "deny", rule = "T-01", flow = "stopped" }

[[step]]
act = "runs_shell"
dialect = "powershell"
command = "Select-String -Path docs/*.md -Pattern '(orca orchestration worker-start)'"
expect = { verdict = "pass", flow = "continues" }
