name = "QA-001: 커밋하는 QA 증거의 압축·영상·trace"
origin = "8.11절 9번 QA-001"

[setup]
remote = false
roles = {}

# 기준 시점: 통과하는 명령 하나를 등록해 깨끗한 실행의 경고가 0이 되게 한다
[[step]]
act = "file"
path = ".fullops/config/lint.json"
content = '{"schema_version": 1, "commands": [{"name": "version", "run": ["git", "--version"]}]}'

[[step]]
act = "commits"
message = "기준"

[[step]]
act = "git"
args = ["tag", "base"]

# 검출: 과제의 qa/ 아래 영상. 코드 lint의 exclude와 별도로 적용한다
[[step]]
act = "file"
path = ".fullops/tasks/PAY-1/qa/flow.webm"
content = "webm"

[[step]]
act = "commits"

[[step]]
act = "runs_fullops"
df = "DF-35"
raw = true
args = ["lint", "--from", "base"]
expect = { verdict = "deny", exit = 2, escape = "ERROR QA-001 .fullops/tasks/PAY-1/qa/flow.webm 커밋하는 QA 증거에 압축·영상·trace 파일이 있다." }

# 검출: 하위 폴더의 trace 묶음(확장자의 대소문자를 가리지 않는다)
[[step]]
act = "git"
args = ["rm", "-q", ".fullops/tasks/PAY-1/qa/flow.webm"]

[[step]]
act = "file"
path = ".fullops/tasks/PAY-1/qa/run1/trace.ZIP"
content = "zip"

[[step]]
act = "commits"

[[step]]
act = "runs_fullops"
df = "DF-35"
raw = true
args = ["lint", "--from", "base"]
expect = { verdict = "deny", exit = 2, escape = "ERROR QA-001 .fullops/tasks/PAY-1/qa/run1/trace.ZIP" }

# 비검출: raw/ 아래, 리뷰 폴더, QA 폴더 밖의 영상, QA 폴더의 이미지와 로그
[[step]]
act = "git"
args = ["rm", "-q", ".fullops/tasks/PAY-1/qa/run1/trace.ZIP"]

[[step]]
act = "file"
path = ".fullops/tasks/PAY-1/qa/raw/trace.ZIP"
content = "zip"

[[step]]
act = "file"
path = ".fullops/tasks/PAY-1/qa/run1/raw/flow.mp4"
content = "mp4"

[[step]]
act = "file"
path = ".fullops/tasks/PAY-1/reviews/0123456789ab/evidence.zip"
content = "zip"

[[step]]
act = "file"
path = "media/demo.mov"
content = "mov"

[[step]]
act = "file"
path = ".fullops/tasks/PAY-1/qa/shot.png"
content = "png"

[[step]]
act = "file"
path = ".fullops/tasks/PAY-1/qa/console.log"
content = "ok\n"

[[step]]
act = "commits"

[[step]]
act = "runs_fullops"
raw = true
args = ["lint", "--from", "base"]
expect = { verdict = "pass", exit = 0, escape = "ERROR 0 / WARNING 0 / 실행 불가 0" }
