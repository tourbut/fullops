'''

[[step]]
act = "commits"
message = "시나리오 파일"

# 준비: 분류하고 인박스를 만든 뒤 지시 본문을 쓴다
[[step]]
act = "lead_routes"
key = "PAY-12"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "lead_writes_task"
key = "PAY-12"
role = "dev"
goal = "결제 재시도 버튼"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "edits_file"
path = ".fullops/inbox/to_dev.md"
old = "- [ ] 구체적 작업과 수정할 파일"
new = """
- [ ] `retry`의 중복 클릭을 막는다
  * [ ] 테스트를 더한다"""

# 오프라인에서는 호출이 없다
[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev", "--max-calls", "1", "--limit", "5"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 상한은 40이다
[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev", "--max-calls", "41"]
expect = { verdict = "error", exit = 1 }

[[step]]
act = "fakes"
names = ["curl"]

# 지도가 작아 배치는 하나다
[[step]]
act = "curl_replies"
when = ["--config", "-"]
times = 1
stdout = '{"model": "jev-1.14.0", "usage": {"input_tokens": 120, "output_tokens": 9}, "answers": {"where": {"type": "choice", "choice": "F003", "probabilities": {"F000": 0.01, "F001": 0.01, "F002": 0.01, "F003": 0.97}, "confidence": 0.9}, "exists": {"type": "noul", "noul": 0.9}}}'

[[step]]
act = "runs_fullops"
env = { FULLOPS_OFFLINE = "0", TYPESAFE_API_KEY = "scenario-key" }
args = ["find", "PAY-12", "--role", "dev", "--force", "--max-calls", "1"]
expect = { verdict = "pass", exit = 0, flow = "continues" }
