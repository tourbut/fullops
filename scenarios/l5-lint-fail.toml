name = "merge: 병합 뒤 lint가 실패하면 병합 전으로 되돌린다"
origin = "설계 12.2절 L5(lint 실패). 같은 단계: review_merge.rs의 merge_reverts_when_lint_fails_after_merge"

# 기준 시점의 검사: OK 파일이 있어야 통과한다. worker의 트리에는 있고, 병합 결과에는 없다.
[[step]]
act = "file"
path = ".fullops-squad/lint/lint.json"
content = """{"schema_version":1,"commands":[{"name":"ok-file","run":["git","ls-files","--error-unmatch","OK"]}],"exclude":[],"rules":[]}
"""

[[step]]
act = "file"
path = "OK"
content = "ok\n"

[[step]]
act = "commits"
message = "검사와 OK 파일"

[[step]]
act = "git"
args = ["push", "-q", "origin", "main"]

[[step]]
act = "worker_reports"
role = "dev"
key = "A-1"

[[step]]
act = "git"
args = ["rm", "-q", "OK"]

[[step]]
act = "commits"
message = "OK 파일을 지운다"

[[step]]
act = "git"
args = ["push", "-q", "origin", "main"]

[[step]]
act = "lead_merges"
key = "A-1"
expect = { verdict = "deny", exit = 2, rule = "M-07", flow = "stopped", escape = "fullops hold" }

# 탈출구: 보류하면 lead의 Stop이 통과한다
[[step]]
act = "runs_fullops"
args = ["hold", "A-1", "--reason", "배포 창을 기다린다", "--owner", "lead", "--resume", "금요일 배포 뒤"]
expect = { verdict = "pass" }

[[step]]
act = "stops"
expect = { verdict = "pass" }
