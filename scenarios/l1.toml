name = "review need: 399줄 / 400줄 / 15파일 / always 경로 / 문서만"
origin = "설계 12.2절 L1. 1.24.0: skip / ask / ask / ask / skip"

# 판정은 --json 출력의 action으로 본다. worker_works는 머리 한 줄과 lines 줄을 쓴다.
[setup]
roles = { dev = "worker", art = "worker", ops = "worker", qa = "worker" }

# 399줄
[[step]]
act = "worker_works"
role = "dev"
key = "L1"
path = "src/a.py"
lines = 398

[[step]]
act = "runs_fullops"
args = ["review", "need", "--from", "main", "--to", "fullops/dev", "--json"]
expect = { verdict = "pass", escape = '"action":"skip"' }

