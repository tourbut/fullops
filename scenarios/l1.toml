# always 경로: 정책은 merge-base 시점의 fullops.toml이다
[[step]]
act = "file"
path = ".fullops/fullops.toml"
content = """
schema = 2
applied_version = "2.0.0"
mode = "coor"
routing = "legacy"
test_level = "lite"
parallel = "on"

[git]
base = "main"
remote = "origin"

[roles.art]
branch = "fullops/art"
kind = "worker"

[roles.dev]
branch = "fullops/dev"
kind = "worker"

[roles.ops]
branch = "fullops/ops"
kind = "worker"

[roles.qa]
branch = "fullops/qa"
kind = "worker"

[review]
always = ["db/migrations/**"]
"""

[[step]]
act = "commits"
message = "always 경로를 정한다"

[[step]]
act = "git"
who = "ops"
args = ["merge", "-q", "main"]

[[step]]
act = "file"
who = "ops"
path = "db/migrations/001.sql"
content = "create table t (id int);\n"

[[step]]
act = "commits"
who = "ops"

[[step]]
act = "runs_fullops"
args = ["review", "need", "--from", "main", "--to", "fullops/ops", "--json"]
expect = { verdict = "pass", escape = '"action":"ask"' }

# 같은 변경도 always가 없던 시점에서 갈라진 브랜치에서는 걸리지 않는다. 문서는 코드 줄로 세지 않는다
[[step]]
act = "file"
who = "qa"
path = "db/migrations/001.sql"
content = "create table t (id int);\n"

[[step]]
act = "file"
who = "qa"
path = "docs/guide.md"
content = "# 안내\n\n긴 문서도 코드 줄로 세지 않는다.\n"

[[step]]
act = "commits"
who = "qa"

[[step]]
act = "runs_fullops"
args = ["review", "need", "--from", "main", "--to", "fullops/qa", "--json"]
expect = { verdict = "pass", escape = '"action":"skip"' }
