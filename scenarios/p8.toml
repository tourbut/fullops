# 준비: 비밀 경로, 비밀값 무늬, 바이너리, 심볼릭 링크
[[step]]
act = "file"
path = ".env"
content = "DB_URL=postgres://hunter2-in-dotenv\n"

[[step]]
act = "file"
path = "config/prod.env"
content = "hunter2-in-prod-env\n"

[[step]]
act = "file"
path = "deploy/secrets.yaml"
content = "value: hunter2-in-secrets\n"

[[step]]
act = "file"
path = "src/keys.rs"
content = '''
const API_KEY: &str = "hunter2-in-code";
pub fn keys() {}
'''

[[step]]
act = "file"
path = "src/blob.rs"
content = "fn blob() {}\n\u0000hunter2-in-binary\n"

[[step]]
act = "file"
path = "src/empty.txt"
content = ""

[[step]]
act = "commits"
message = "시나리오 파일"

# 준비: 분류하고 인박스를 만든 뒤 지시 본문을 쓴다
[[step]]
act = "lead_routes"
key = "PAY-12"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "lead_writes_task"
key = "PAY-12"
role = "dev"
goal = "결제 재시도 버튼"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "edits_file"
path = ".fullops-squad/handovers/to_dev.md"
old = "- [ ] 구체적 작업과 수정할 파일"
new = """
- [ ] `retry`의 중복 클릭을 막는다
  * [ ] 테스트를 더한다"""

# 심볼릭 링크는 tree에만 넣는다(빈 blob을 가리킨다. Windows에서도 같다)
[[step]]
act = "git"
args = ["update-index", "--add", "--cacheinfo", "120000,e69de29bb2d1d6434b8b29ae775ad8c2e48c5391,src/link.rs"]

[[step]]
act = "git"
args = ["commit", "-q", "-m", "심볼릭 링크"]

[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev", "--scope", "documents"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 비밀 경로는 거부하고 비밀값 무늬가 든 글은 보내지 않는다
[[step]]
act = "runs_fullops"
args = ["context", "PAY-12", "--role", "dev", "--paths", ".env", "src/keys.rs", "docs/pay.md"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

[[step]]
act = "fakes"
names = ["curl"]

# 지도의 네 항목 가운데 `src/pay/retry.rs`를 고른 답
[[step]]
act = "curl_replies"
when = ["--config", "-"]
times = 1
stdout = '{"model": "jev-1.14.0", "usage": {"input_tokens": 120, "output_tokens": 9}, "answers": {"where": {"type": "choice", "choice": "F003", "probabilities": {"F000": 0.01, "F001": 0.01, "F002": 0.01, "F003": 0.97}, "confidence": 0.9}, "exists": {"type": "noul", "noul": 0.9}}}'

# fake-curl이 받은 요청 본문에도 비밀이 없다(tests/explore.rs가 본다)
[[step]]
act = "runs_fullops"
env = { FULLOPS_OFFLINE = "0", TYPESAFE_API_KEY = "scenario-key" }
args = ["find", "PAY-12", "--role", "dev", "--force"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 보낼 수 있는 후보는 `docs/pay.md` 하나다
[[step]]
act = "curl_replies"
when = ["--config", "-"]
times = 1
stdout = '{"model": "jev-1.14.0", "usage": {"input_tokens": 50, "output_tokens": 4}, "answers": {"relevant": {"type": "noul", "noul": 0.9}, "evidence": {"type": "noul", "noul": 0.8}, "contradicts": {"type": "noul", "noul": 0.0}, "injection": {"type": "noul", "noul": 0.0}}}'

[[step]]
act = "runs_fullops"
env = { FULLOPS_OFFLINE = "0", TYPESAFE_API_KEY = "scenario-key" }
args = ["context", "PAY-12", "--role", "dev", "--force", "--paths", ".env", "src/keys.rs", "docs/pay.md"]
expect = { verdict = "pass", exit = 0, flow = "continues" }
