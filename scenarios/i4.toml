name = "미처리 메시지가 있으면 종료를 막고, 문구대로 처리 표시하면 통과한다"
origin = "설계 12.2절 I4 (DF-18)"

[[step]]
act = "session_starts"
expect = { verdict = "context", flow = "continues" }

[[step]]
act = "worker_reports"
role = "dev"
key = "A-1"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
expect = { verdict = "block", rule = "X-05", flow = "stopped", escape = "fullops merge" }

[[step]]
act = "lead_merges"
key = "A-1"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "user_prompts"
text = "다음"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
expect = { verdict = "pass", flow = "continues" }

# 통합 대기가 아닌 보고(리뷰·조사 보고)는 `wait --ack`로 처리 표시한다.
# 리뷰 배정은 snapshot의 40자 SHA가 있어야 해서 시나리오로 적을 수 없다. 같은 갈래인 조사 배정으로 본다.
# 앞의 Run은 X-05의 효과로 닫혔으므로 새 Run을 준다
[[step]]
act = "lead_dispatches"
key = "B-2"
role = "dev"
purpose = "research"
run = "run_2"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "orca_sends"
id = "msg_review"
subject = "B-2 조사"

[[step]]
act = "lead_waits"
no_wait = true
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
expect = { verdict = "block", rule = "X-05", flow = "stopped", escape = "--ack msg_review" }

[[step]]
act = "lead_waits"
ack = ["msg_review"]
no_wait = true
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "user_prompts"
text = "다음"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
df = "DF-18"
expect = { verdict = "pass", flow = "continues" }

# 실패한 구현 보고도 통합 대기가 아니다. 앞의 Run은 닫혔으므로 새 Run으로 배정한다
[[step]]
act = "lead_dispatches"
df = "DF-18"
key = "C-3"
role = "dev"
run = "run_3"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "orca_sends"
id = "msg_failed"
outcome = "failed"
subject = "C-3 실패"

[[step]]
act = "lead_waits"
no_wait = true
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
expect = { verdict = "block", rule = "X-05", flow = "stopped", escape = "--ack msg_failed" }

[[step]]
act = "lead_waits"
ack = ["msg_failed"]
no_wait = true
expect = { verdict = "pass", flow = "continues" }

# 실패한 과제는 처리 표시만으로 끝나지 않는다. 다시 배정하거나 미룰 때까지 X-07이 한 번 알린다
[[step]]
act = "user_prompts"
text = "다음"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
expect = { verdict = "block", rule = "X-07", flow = "stopped", escape = "fullops dispatch C-3" }

[[step]]
act = "lead_plans"
key = "C-3"
role = "dev"
status = "보류(실패 원인 확인)"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
df = "DF-18"
expect = { verdict = "pass", flow = "continues" }
