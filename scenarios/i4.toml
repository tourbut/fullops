# 다른 묶음의 명령이 만드는 state.json과 세션 기록에 기대는 단계는 pending이다.
# 같은 규칙의 걸림·안 걸림은 crates/fullops/tests/hook.rs가 저장 계층으로 상태를 만들어 지금 확인한다.
name = "미처리 메시지가 있으면 종료를 막고, 문구대로 처리 표시하면 통과한다"
origin = "설계 12.2절 I4 (DF-18)"

[[step]]
act = "session_starts"
expect = { verdict = "context", flow = "continues" }

[[step]]
act = "worker_reports"
role = "dev"
key = "A-1"
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
pending = "C"
expect = { verdict = "block", rule = "X-05", flow = "stopped", escape = "fullops merge" }

[[step]]
act = "lead_merges"
key = "A-1"
pending = "E"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "user_prompts"
text = "다음"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
pending = "E"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "lead_dispatches"
key = "B-2"
role = "dev"
purpose = "review"
bare = true
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "orca_sends"
id = "msg_review"
subject = "B-2 리뷰"
pending = "C"

[[step]]
act = "lead_waits"
no_wait = true
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
pending = "C"
expect = { verdict = "block", rule = "X-05", flow = "stopped", escape = "--ack msg_review" }

[[step]]
act = "lead_waits"
ack = ["msg_review"]
no_wait = true
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "user_prompts"
text = "다음"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "orca_sends"
id = "msg_failed"
outcome = "failed"
subject = "B-2 실패"
pending = "C"

[[step]]
act = "lead_waits"
no_wait = true
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
pending = "C"
expect = { verdict = "block", rule = "X-05", flow = "stopped", escape = "--ack msg_failed" }

[[step]]
act = "lead_waits"
ack = ["msg_failed"]
no_wait = true
pending = "C"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "user_prompts"
text = "다음"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
pending = "C"
expect = { verdict = "pass", flow = "continues" }
