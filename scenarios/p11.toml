name = "탐색 색인: 바뀐 파일만 다시 읽고, 지우면 다시 만든다"
origin = "설계 12.2절 P11 (동시 실행과 읽은 blob 수는 tests/explore.rs와 store의 시험이 본다)"

# 준비: 필수 문서 여섯, 코드, 문서를 커밋한다
[[step]]
act = "file"
path = ".fullops/guide/FULLOPS.md"
content = '''
# FULLOPS.md

공통 기준 문서.
'''

[[step]]
act = "file"
path = ".fullops/guide/project.md"
content = '''
# project.md

공통 기준 문서.
'''

[[step]]
act = "file"
path = ".fullops/guide/rules/common/README.md"
content = '''
# README.md

공통 기준 문서.
'''

[[step]]
act = "file"
path = ".fullops/guide/rules/common/coding-style.md"
content = '''
# coding-style.md

공통 기준 문서.
'''

[[step]]
act = "file"
path = ".fullops/guide/rules/common/security.md"
content = '''
# security.md

공통 기준 문서.
'''

[[step]]
act = "file"
path = ".fullops/guide/rules/common/testing.md"
content = '''
# testing.md

공통 기준 문서.
'''

[[step]]
act = "file"
path = "src/pay/retry.rs"
content = '''
pub fn retry(order: u32) -> u32 {
    order
}
'''

[[step]]
act = "file"
path = "src/pay/card.rs"
content = '''
pub fn charge_card() -> u32 {
    retry(1)
}
'''

[[step]]
act = "file"
path = "docs/pay.md"
content = '''
# 결제 설계

[재시도](../src/pay/retry.rs) 정책을 적는다.
'''

[[step]]
act = "commits"
message = "시나리오 파일"

# 준비: 분류하고 인박스를 만든 뒤 지시 본문을 쓴다
[[step]]
act = "lead_routes"
key = "PAY-12"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "lead_writes_task"
key = "PAY-12"
role = "dev"
goal = "결제 재시도 버튼"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "edits_file"
path = ".fullops/inbox/to_dev.md"
old = "- [ ] 구체적 작업과 수정할 파일"
new = """
- [ ] `retry`의 중복 클릭을 막는다
  * [ ] 테스트를 더한다"""

[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

[[step]]
act = "file"
path = "src/pay/retry.rs"
content = '''
pub fn retry(order: u32) -> u32 {
    order + 2
}
'''

[[step]]
act = "commits"
message = "파일 하나를 바꾼다"

# 커밋이 달라졌다
[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev"]
expect = { verdict = "deny", rule = "J-04", flow = "stopped", escape = "--force" }

# 바뀐 blob 하나만 다시 읽는다
[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev", "--force"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 색인 파일을 지운다
[[step]]
act = "deletes_file"
path = ".git/fullops/search/code.json"

# 전부 다시 만든다
[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev", "--force"]
expect = { verdict = "pass", exit = 0, flow = "continues" }
