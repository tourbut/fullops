# suggest_omit·conflict·caution·keep(tests/explore.rs가 결과 파일을 본다)
[[step]]
act = "runs_fullops"
env = { FULLOPS_OFFLINE = "0", TYPESAFE_API_KEY = "scenario-key" }
args = ["context", "PAY-12", "--role", "dev", "--force", "--paths", "docs/old.md", "docs/conflict.md", "docs/prompt.md", ".fullops/guide/FULLOPS.md"]
expect = { verdict = "pass", exit = 0, flow = "continues" }
