# 준비: 분류하고 인박스를 만든 뒤 지시 본문을 쓴다
[[step]]
act = "lead_routes"
key = "PAY-12"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "lead_writes_task"
key = "PAY-12"
role = "dev"
goal = "결제 재시도 버튼"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "edits_file"
path = ".fullops/inbox/to_dev.md"
old = "- [ ] 구체적 작업과 수정할 파일"
new = """
- [ ] `retry`의 중복 클릭을 막는다
  * [ ] 테스트를 더한다"""

# 가짜 curl을 먼저 둔다. 거절과 오프라인에서는 부르지 않는다(tests/explore.rs가 호출 수를 센다)
[[step]]
act = "fakes"
names = ["curl"]

[[step]]
act = "runs_fullops"
args = ["context", "PAY-12", "--role", "dev", "--paths", "docs/c00.md", "docs/c01.md", "docs/c02.md", "docs/c03.md", "docs/c04.md", "docs/c05.md", "docs/c06.md", "docs/c07.md", "docs/c08.md", "docs/c09.md", "docs/c10.md", "docs/c11.md", "docs/c12.md", "docs/c13.md", "docs/c14.md", "docs/c15.md", "docs/c16.md", "docs/c17.md", "docs/c18.md", "docs/c19.md", "docs/c20.md"]
expect = { verdict = "deny", rule = "J-02", flow = "stopped", escape = "find" }

# J-02에 안 걸린다. 오프라인이라 전부 keep이다
[[step]]
act = "runs_fullops"
args = ["context", "PAY-12", "--role", "dev", "--paths", "docs/pay.md", ".fullops/guide/FULLOPS.md", "README.md"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 후보마다 한 번씩 묻는다. 무관한 후보
[[step]]
act = "curl_replies"
when = ["--config", "-"]
times = 1
stdout = '{"model": "jev-1.14.0", "usage": {"input_tokens": 50, "output_tokens": 4}, "answers": {"relevant": {"type": "noul", "noul": 0.05}, "evidence": {"type": "noul", "noul": 0.1}, "contradicts": {"type": "noul", "noul": 0.0}, "injection": {"type": "noul", "noul": 0.0}}}'

