[[step]]
act = "file"
path = "src/pay/retry.rs"
content = '''
pub fn retry(order: u32) -> u32 {
    order
}
'''

[[step]]
act = "file"
path = "src/pay/card.rs"
content = '''
pub fn charge_card() -> u32 {
    retry(1)
}
'''

[[step]]
act = "file"
path = "docs/pay.md"
content = '''
# 결제 설계

[재시도](../src/pay/retry.rs) 정책을 적는다.
'''

[[step]]
act = "commits"
message = "시나리오 파일"

# 준비: 분류하고 인박스를 만든 뒤 지시 본문을 쓴다
[[step]]
act = "lead_routes"
key = "PAY-12"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "lead_writes_task"
key = "PAY-12"
role = "dev"
goal = "결제 재시도 버튼"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "edits_file"
path = ".fullops/inbox/to_dev.md"
old = "- [ ] 구체적 작업과 수정할 파일"
new = """
- [ ] `retry`의 중복 클릭을 막는다
  * [ ] 테스트를 더한다"""

[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 같은 입력: 호출 없이 있던 결과를 낸다(J-04에 안 걸린다)
[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

[[step]]
act = "runs_fullops"
args = ["context", "PAY-12", "--role", "dev", "--paths", "docs/pay.md"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 같은 입력
[[step]]
act = "runs_fullops"
args = ["context", "PAY-12", "--role", "dev", "--paths", "docs/pay.md"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 원문 파일 하나를 고친다
[[step]]
act = "file"
path = "docs/pay.md"
content = '''
# 결제 설계

[재시도](../src/pay/retry.rs) 정책을 적는다.

재시도는 세 번까지다.
'''

# 후보 문서가 바뀌었다(options.sources)
[[step]]
act = "runs_fullops"
args = ["context", "PAY-12", "--role", "dev", "--paths", "docs/pay.md"]
expect = { verdict = "deny", rule = "J-04", flow = "stopped", escape = "--force" }

[[step]]
act = "runs_fullops"
args = ["context", "PAY-12", "--role", "dev", "--paths", "docs/pay.md", "--force", "--required", "docs/pay.md"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

[[step]]
act = "commits"
message = "커밋을 하나 더한다"

[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev"]
expect = { verdict = "deny", rule = "J-04", flow = "stopped", escape = "--force" }

# 키 없이 만든다
[[step]]
act = "runs_fullops"
env = { FULLOPS_OFFLINE = "0" }
args = ["find", "PAY-12", "--role", "dev", "--force"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 키를 넣는다. 각본이 없는 fake-curl은 연결 실패라 어느 쪽이든 로컬 후보로 끝난다
[[step]]
act = "fakes"
names = ["curl"]

# options.provider가 달라졌다
[[step]]
act = "runs_fullops"
env = { FULLOPS_OFFLINE = "0", TYPESAFE_API_KEY = "scenario-key" }
args = ["find", "PAY-12", "--role", "dev"]
expect = { verdict = "deny", rule = "J-04", flow = "stopped", escape = "--force" }

# 새 결과와 history/의 사본
[[step]]
act = "runs_fullops"
env = { FULLOPS_OFFLINE = "0", TYPESAFE_API_KEY = "scenario-key" }
args = ["find", "PAY-12", "--role", "dev", "--force"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# Jev가 답한 결과를 만든다
[[step]]
act = "curl_replies"
when = ["--config", "-"]
times = 1
stdout = '{"model": "jev-1.14.0", "usage": {"input_tokens": 120, "output_tokens": 9}, "answers": {"where": {"type": "choice", "choice": "F003", "probabilities": {"F000": 0.01, "F001": 0.01, "F002": 0.01, "F003": 0.97}, "confidence": 0.9}, "exists": {"type": "noul", "noul": 0.9}}}'

[[step]]
act = "runs_fullops"
env = { FULLOPS_OFFLINE = "0", TYPESAFE_API_KEY = "scenario-key" }
args = ["find", "PAY-12", "--role", "dev", "--force"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 같은 입력으로 다시: fake-curl 호출이 늘지 않는다(tests/explore.rs가 센다)
[[step]]
act = "runs_fullops"
env = { FULLOPS_OFFLINE = "0", TYPESAFE_API_KEY = "scenario-key" }
args = ["find", "PAY-12", "--role", "dev"]
expect = { verdict = "pass", exit = 0, flow = "continues" }
