content = '''
# 결제 설계

[재시도](../src/pay/retry.rs) 정책을 적는다.
'''

[[step]]
act = "commits"
message = "시나리오 파일"

# 준비: 분류하고 인박스를 만든 뒤 지시 본문을 쓴다
[[step]]
act = "lead_routes"
key = "PAY-12"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "lead_writes_task"
key = "PAY-12"
role = "dev"
goal = "결제 재시도 버튼"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "edits_file"
path = ".fullops-squad/handovers/to_dev.md"
old = "- [ ] 구체적 작업과 수정할 파일"
new = """
- [ ] `retry`의 중복 클릭을 막는다
  * [ ] 테스트를 더한다"""

# J-01: 인박스의 키가 다르다
[[step]]
act = "runs_fullops"
args = ["find", "OTHER-9", "--role", "dev"]
expect = { verdict = "deny", rule = "J-01", flow = "stopped", escape = "task new" }

# J-01에 안 걸린다. 오프라인이라 로컬 후보다
[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev", "--scope", "documents"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

[[step]]
act = "runs_fullops"
args = ["context", "PAY-12", "--role", "dev", "--paths", "docs/pay.md"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 진행 체크(들여쓴 `* [X]` 포함)와 front matter status만 고친다
[[step]]
act = "edits_file"
path = ".fullops-squad/handovers/to_dev.md"
old = "- [ ] `retry`의"
new = "- [x] `retry`의"

[[step]]
act = "edits_file"
path = ".fullops-squad/handovers/to_dev.md"
old = "  * [ ] 테스트"
new = "  * [X] 테스트"

[[step]]
act = "edits_file"
path = ".fullops-squad/handovers/to_dev.md"
old = "status: draft"
new = "status: review"

# 지문이 바뀌지 않는다. 같은 입력이라 있던 결과를 낸다(J-04에 안 걸린다)
[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 지시 본문을 고치면 입력이 달라진다. 말없이 덮어쓰지 않는다
[[step]]
act = "edits_file"
path = ".fullops-squad/handovers/to_dev.md"
old = "중복 클릭을 막는다"
new = "중복 클릭과 연타를 막는다"

[[step]]
act = "runs_fullops"
args = ["find", "PAY-12", "--role", "dev"]
expect = { verdict = "deny", rule = "J-04", flow = "stopped", escape = "--force" }

# 탐색 결과는 Git 공용 디렉터리에 있어 커밋되지 않는다. 배정이 이어진다(작업 트리에 남지 않는 것은 tests/explore.rs가 본다)
[[step]]
act = "lead_dispatches"
df = "DF-16"
key = "PAY-12"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

