name = "LINT-001: 브랜치가 lint.json을 바꿨다"
origin = "8.11절 9번 LINT-001"

[setup]
remote = false
roles = {}

[[step]]
act = "file"
path = ".fullops-squad/lint/lint.json"
content = '{"schema_version": 1, "commands": [{"name": "version", "run": ["git", "--version"]}]}'

[[step]]
act = "commits"
message = "기준"

[[step]]
act = "git"
args = ["tag", "base"]

# 검출: 기준 시점 뒤에 lint.json을 고쳤다. 고친 내용(없는 실행 파일)은 적용되지 않는다
[[step]]
act = "file"
path = ".fullops-squad/lint/lint.json"
content = '{"schema_version": 1, "commands": [{"name": "missing", "run": ["fullops-no-such-program"]}]}'

[[step]]
act = "commits"

[[step]]
act = "runs_fullops"
raw = true
args = ["lint", "--from", "base"]
expect = { verdict = "pass", exit = 0, escape = "WARNING LINT-001 .fullops-squad/lint/lint.json" }

[[step]]
act = "runs_fullops"
raw = true
args = ["lint", "--from", "base"]
expect = { verdict = "pass", exit = 0, escape = "[passed] version" }

# 비검출: lint.json을 기준 시점과 같게 되돌렸다
[[step]]
act = "file"
path = ".fullops-squad/lint/lint.json"
content = '{"schema_version": 1, "commands": [{"name": "version", "run": ["git", "--version"]}]}'

[[step]]
act = "file"
path = "notes/a.txt"
content = "메모\n"

[[step]]
act = "commits"

[[step]]
act = "runs_fullops"
raw = true
args = ["lint", "--from", "base"]
expect = { verdict = "pass", exit = 0, escape = "ERROR 0 / WARNING 0 / 실행 불가 0" }
