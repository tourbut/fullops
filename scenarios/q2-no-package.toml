name = "install: 플러그인 루트가 없다(install.json의 source 폴더가 없다)"
origin = "12.2 Q2"

[[step]]
act = "fakes"
names = ["claude", "codex", "grok", "agy", "npx"]
[[step]]
act = "file"
path = "../home/.fullops/install.json"
content = "{\"version\":\"0.0.1\",\"sha256\":\"\",\"source\":\"../missing\",\"at\":0,\"previous\":null}\n"
# grok·agy의 플러그인만 건너뛰고 grok의 hook 등록 파일은 쓴다
[[step]]
act = "runs_fullops"
raw = true
args = ["install"]
env = { PATH = "../bin", FULLOPS_OFFLINE = "0" }
expect = { verdict = "pass", exit = 0, escape = "통합 패키지 폴더를 찾지 못해" }
