name = "dispatch를 받은 세션의 하위 배정은 자기 Run으로만 간다"
origin = "12.2 D8"

[[step]]
act = "lead_dispatches"
key = "A-1"
role = "dev"
expect = { verdict = "pass" }

[[step]]
act = "worker_subdispatches"
role = "dev"
key = "A-1"
brief = "src/b.py를 맡는다. 끝나면 바꾼 파일을 보고한다"
expect = { verdict = "pass", flow = "continues" }

# 상위 Run(lead의 Run)으로는 보내지 못한다
[[step]]
act = "runs_fullops"
who = "dev"
args = ["dispatch", "A-1", "--brief", "src/c.py", "--run", "run_1"]
expect = { verdict = "deny", rule = "D-04", escape = "--run" }
