name = "merge를 M-06·M-09에서 죽인 자리에서 다시 실행한다"
origin = "설계 18.2절 E의 끝났다는 확인. 같은 단계: review_merge.rs의 merge_resumes_from_where_it_died"

# 죽은 자리는 그 단계까지만 끝난 저장소 상태로 만든다: M-06 뒤는 날것 git merge, M-09 앞은 --no-push, M-09 뒤는 날것 git push.

[[step]]
act = "worker_reports"
role = "dev"
key = "A-1"

[[step]]
act = "git"
args = ["merge", "-q", "--no-edit", "fullops/dev"]

[[step]]
act = "lead_merges"
key = "A-1"
expect = { verdict = "pass", exit = 0, escape = "already" }

[[step]]
act = "worker_reports"
role = "dev"
key = "B-2"

[[step]]
act = "runs_fullops"
args = ["merge", "B-2", "--no-push"]
expect = { verdict = "pass", escape = "push_left" }

[[step]]
act = "stops"
expect = { verdict = "block", rule = "X-05", escape = "X-06 미통합 완료 보고" }

[[step]]
act = "git"
args = ["push", "-q", "origin", "main"]

# 날것 push로 통합된 보고는 Stop의 통합 확인(X-06의 효과)이 처리 표시한다. 다시 실행한 merge는 기록만 맞춘다
[[step]]
act = "lead_merges"
key = "B-2"
expect = { verdict = "pass", exit = 0 }

[[step]]
act = "stops"
expect = { verdict = "pass" }
