# 준비: init이 두는 .gitignore의 한 줄(덮어쓴 탐색 결과의 이전 사본은 커밋하지 않는다)
[[step]]
act = "file"
path = ".fullops-squad/.gitignore"
content = "docs/evaluations/jev/history/\n"

[[step]]
act = "commits"
message = "시나리오 파일"

# 준비: 분류하고 인박스를 만든 뒤 지시 본문을 쓴다
[[step]]
act = "lead_routes"
key = "PAY-12"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "lead_writes_task"
key = "PAY-12"
role = "dev"
goal = "결제 재시도 버튼"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "edits_file"
path = ".fullops-squad/handovers/to_dev.md"
old = "- [ ] 구체적 작업과 수정할 파일"
new = """
- [ ] `retry`의 중복 클릭을 막는다
  * [ ] 테스트를 더한다"""

[[step]]
act = "runs_fullops"
args = ["packet", "build", "PAY-12", "--role", "dev", "--seed", "src/pay/retry.rs", "--write-inbox"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

# 배정의 준비 커밋과 동기화가 패킷과 인박스를 역할 워크트리로 옮긴다
[[step]]
act = "lead_dispatches"
key = "PAY-12"
role = "dev"
expect = { verdict = "pass", flow = "continues" }

# worker가 미커밋 코드 변경을 남기고 끊겼다
[[step]]
act = "file"
who = "dev"
path = "src/pay/card.rs"
content = """
pub fn charge_card() -> u32 {
    retry(2)
}
"""

# lead가 역할 워크트리를 복구한다. WIP 커밋이 바꾼 파일이 direct_edit 항목에 들고, 패킷과 인박스가 `패킷 갱신` 커밋에 들어간다
[[step]]
act = "runs_fullops"
args = ["task", "recover", "--role", "dev", "--key", "PAY-12", "--repo", "../dev"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

[[step]]
act = "runs_fullops"
args = ["packet", "check", "PAY-12", "--role", "dev", "--repo", "../dev"]
expect = { verdict = "pass", exit = 0, flow = "continues" }

