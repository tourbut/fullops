name = "깨진 설정 파일에서는 도구 호출을 거부하고 복구 명령과 설정 편집만 받는다"
origin = "설계 12.2절 A3"

[[step]]
act = "session_starts"
expect = { verdict = "context", flow = "continues" }

[[step]]
act = "file"
path = ".fullops-squad/fullops.toml"
content = "schema = = 2\n"

[[step]]
act = "session_starts"
session = "2"
expect = { verdict = "context", flow = "continues", escape = "정책 오류" }

[[step]]
act = "writes_file"
path = "notes.md"
content = "메모\n"
expect = { verdict = "deny", rule = "T-00", flow = "stopped", escape = "fullops doctor" }

[[step]]
act = "runs_shell"
command = "ls -la"
expect = { verdict = "deny", rule = "T-00", flow = "stopped" }

[[step]]
act = "runs_shell"
df = "DF-26"
command = "fullops doctor"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "runs_shell"
command = "fullops doctor && fullops dispatch A-1"
expect = { verdict = "deny", rule = "T-00", flow = "stopped" }

[[step]]
act = "user_prompts"
df = "DF-25"
text = "왜 막히지?"
expect = { verdict = "context", flow = "continues", escape = "fullops doctor" }

[[step]]
act = "user_prompts"
df = "DF-25"
text = "다시 물어본다"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "writes_file"
df = "DF-26"
path = ".fullops-squad/fullops.toml"
content = "schema = 2\napplied_version = \"2.0.0\"\nmode = \"coor\"\nrouting = \"legacy\"\ntest_level = \"lite\"\nparallel = \"on\"\n\n[git]\nbase = \"main\"\nremote = \"origin\"\n\n[roles.dev]\nbranch = \"fullops/dev\"\nkind = \"worker\"\n"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "writes_file"
df = "DF-26"
path = "notes.md"
content = "메모\n"
expect = { verdict = "pass", flow = "continues" }

[[step]]
act = "stops"
df = "DF-26"
expect = { verdict = "pass", flow = "continues" }
